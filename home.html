<html>
    <head>
        <title>Home Page</title>
    </head>
    <body>
        <h1>This is a Page Heading from HTML </h1>
        <p>This is a Paragraph 1 from HTML</p>
        <div id="root">

        </div>
        <div id="main">

        </div>
    </body>

    <script>
        var h1=document.createElement("h1");
        h1.textContent="This is a Heading created from JS";
        var p=document.createElement("p");
        p.textContent = "This is a paragraph created from JS";

        var root = document.getElementById("root");
        root.appendChild(h1);
        root.appendChild(p);
    </script>

    <script crossorigin  src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin  src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
        var mainReact;
        var hOneReact = React.createElement("h1",{"id":"head1","xyz":"xyz_value"},"HEADING CREATED using React");
        var reactPara = React.createElement("p",{},"Paragraph rendered by React");
        var htmlRoot = document.getElementById("main");
        var rootReact = ReactDOM.createRoot(htmlRoot);

        var mainDiv = React.createElement("div",{},[hOneReact,reactPara]);
        //test code

        //rootReact.render(hOneReact);
        rootReact.render(mainDiv);
    </script>
</html>
